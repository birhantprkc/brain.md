name: Publish

# Controlled release via npm Trusted Publisher (OIDC) — no long-lived publish token.
#
# One-time setup on https://www.npmjs.com (package or org @mindmux):
#   Trusted Publisher → GitHub Actions
#     Organization: mindmuxai
#     Repository:   brain.md
#     Workflow:     publish.yml
#     Environment:  (leave empty unless you use GitHub Environments)
#
# If the package does not exist yet, create it once (local interactive 2FA):
#   npm login && npm publish --access public
# then attach the Trusted Publisher above; later releases use this workflow.
#
# Trigger:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   # tag must match package.json "version"
# or: Actions → Publish → Run workflow on main (confirm = publish)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish package.json version to npm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for OIDC trusted publisher + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Tags always publish; manual runs only from main after typing "publish".
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm == 'publish' &&
       github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@mindmux"
          # Do not cache npm: a poisoned cache can steal OIDC credentials.
          package-manager-cache: false

      # Trusted Publisher needs npm >= 11.5.1
      - name: Ensure modern npm
        run: npm install -g npm@latest && npm --version

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing @mindmux/brain-md@$PKG (tag v$TAG)"

      # Intentionally no NODE_AUTH_TOKEN: a read-capable token that cannot
      # publish would force the token auth path and 403 under 2FA policy.
      # Auth is OIDC Trusted Publisher only.
      - name: Publish to npm
        run: npm publish --access public --provenance
