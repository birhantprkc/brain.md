name: Publish

# Controlled release: tag vX.Y.Z (must match package.json version) or
# workflow_dispatch on main with confirm=publish.
#
# Requires repo secret NPM_TOKEN. Create on https://www.npmjs.com/settings/~/tokens
# as a Granular Access Token (or Automation):
#   - Permissions: Packages → Read and write
#   - Organizations / scopes: mindmux (or packages under @mindmux/*)
#   - Enable "Bypass two-factor authentication" (required for CI publish when 2FA is on)
#   - Do not use a read-only or classic token
#
# Then: gh secret set NPM_TOKEN --repo mindmuxai/brain.md
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish package.json version to npm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm == 'publish' &&
       github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@mindmux"

      - name: Ensure modern npm
        run: npm install -g npm@latest && npm --version

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing @mindmux/brain-md@$PKG (tag v$TAG)"

      - name: Check npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is empty"
            exit 1
          fi
          echo "NPM_TOKEN length: ${#NODE_AUTH_TOKEN}"
          case "$NODE_AUTH_TOKEN" in
            npm_*) echo "NPM_TOKEN prefix: npm_" ;;
            *) echo "NPM_TOKEN prefix: unexpected (expected npm_*)" ;;
          esac
          if [[ "$NODE_AUTH_TOKEN" == *$'\n'* ]] || [[ "$NODE_AUTH_TOKEN" == *$'\r'* ]]; then
            echo "NPM_TOKEN contains a newline/CR — re-set the secret without trailing newline"
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
          echo "npm whoami succeeded"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
